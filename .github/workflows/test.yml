on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - id: changelog
        uses: ./
      - name: Print version
        run: echo "$PREV_VERSION -> $VERSION"
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          PREV_VERSION: ${{ steps.changelog.outputs.prevVersion }}
      - name: Print CHANGELOG
        run: echo $CHANGELOG
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
      - name: Print CHANGELOG file
        run: cat CHANGELOG.md
